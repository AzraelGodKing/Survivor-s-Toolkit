# Publishes Survivor's Toolkit as a GitHub release the app's self-update finds:
#   tag v<Version>, with SurvivorsToolkit-<Version>-win-x64.exe and SHA256SUMS.txt.
# The version is <Version> in Directory.Build.props; bump it, and add a "## <Version>" section to CHANGELOG.md, before
# running this. That section is the release's notes and what the app shows once after updating to it.
name: Release

on:
  workflow_dispatch:
    inputs:
      notes:
        description: "Extra notes put above the CHANGELOG.md section (optional)"
        required: false
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Read version
        id: meta
        run: |
          $v = ([xml](Get-Content Directory.Build.props)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          if (-not $v) { throw "No <Version> in Directory.Build.props" }
          "version=$v" >> $env:GITHUB_OUTPUT
          "tag=v$v" >> $env:GITHUB_OUTPUT
      - name: Read the change notes
        shell: bash
        run: |
          version="${{ steps.meta.outputs.version }}"
          # CHANGELOG.md wraps long items onto indented lines; GitHub shows every line break in release notes, so those
          # lines are joined back onto their item (a nested "- " item stays on its own line). The same as ModWright.
          awk -v v="$version" '
            { sub(/\r$/, "") }
            $0 == "## " v { on = 1; next }
            on && /^## / { exit }
            !on { next }
            held && /^[ \t]+[^ \t]/ && !/^[ \t]+[-*+][ \t]/ { sub(/^[ \t]+/, ""); buf = buf " " $0; next }
            { if (held) print buf; buf = $0; held = /[^ \t]/; if (!held) print }
            END { if (held) print buf }
          ' CHANGELOG.md > changelog-notes.md
          if ! grep -q '[^[:space:]]' changelog-notes.md; then
            echo "::error::CHANGELOG.md has no '## $version' section"
            exit 1
          fi
      - name: Refuse an existing tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${{ steps.meta.outputs.tag }}" --repo "${{ github.repository }}" 2>$null
          if ($LASTEXITCODE -eq 0) { throw "${{ steps.meta.outputs.tag }} is already released. Bump <Version> in Directory.Build.props." }
          $global:LASTEXITCODE = 0
      - name: Test
        run: dotnet test SurvivorsToolkit.sln -c Release
      - name: Publish
        run: |
          dotnet publish src/SurvivorsToolkit/SurvivorsToolkit.csproj -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:PublishReadyToRun=true -o publish
          $name = "SurvivorsToolkit-${{ steps.meta.outputs.version }}-win-x64.exe"
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item publish/SurvivorsToolkit.exe "release/$name"
          $hash = (Get-FileHash "release/$name" -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -Path release/SHA256SUMS.txt -Value "$hash  $name" -NoNewline -Encoding ascii
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ inputs.notes }}
        run: |
          $notes = Get-Content changelog-notes.md -Raw
          if ($env:NOTES) { $notes = $env:NOTES + "`n`n" + $notes }
          Set-Content -Path release-notes.md -Value $notes -Encoding utf8
          gh release create "${{ steps.meta.outputs.tag }}" (Get-ChildItem release/*).FullName `
            --repo "${{ github.repository }}" --target "${{ github.sha }}" `
            --title "Survivor's Toolkit ${{ steps.meta.outputs.version }}" --notes-file release-notes.md
