# Publishes Survivor's Toolkit as a GitHub release the app's self-update finds, the same files ModWright ships:
#   tag v<Version>, with SurvivorsToolkit-<Version>-Setup.exe (installer, updates through Velopack) and its update
#   packages, SurvivorsToolkit-<Version>-win-x64.exe (standalone), SurvivorsToolkit-<Version>-win-x64-framework-dependent.zip
#   (small folder build) and SHA256SUMS.txt.
# The version is <Version> in Directory.Build.props; bump it, and add a "## <Version>" section to CHANGELOG.md, before
# releasing. That section is the release's notes and what the app shows once after updating to it.
# Starts on a pushed tag like v1.2.0 ("Promote test and release" pushes one), which must match <Version>, or by hand
# (Actions > Release > Run workflow), which tags the commit it runs on.
name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']
  workflow_dispatch:
    inputs:
      notes:
        description: "Extra notes put above the CHANGELOG.md section (optional)"
        required: false
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Read version
        id: meta
        run: |
          $v = ([xml](Get-Content Directory.Build.props)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          if (-not $v) { throw "No <Version> in Directory.Build.props" }
          if ('${{ github.ref_type }}' -eq 'tag' -and '${{ github.ref_name }}' -ne "v$v") {
            throw "Tag ${{ github.ref_name }} does not match <Version>$v</Version> in Directory.Build.props"
          }
          "version=$v" >> $env:GITHUB_OUTPUT
          "tag=v$v" >> $env:GITHUB_OUTPUT
      - name: Read the change notes
        shell: bash
        run: |
          version="${{ steps.meta.outputs.version }}"
          # CHANGELOG.md wraps long items onto indented lines; GitHub shows every line break in release notes, so those
          # lines are joined back onto their item (a nested "- " item stays on its own line). The same as ModWright.
          awk -v v="$version" '
            { sub(/\r$/, "") }
            $0 == "## " v { on = 1; next }
            on && /^## / { exit }
            !on { next }
            held && /^[ \t]+[^ \t]/ && !/^[ \t]+[-*+][ \t]/ { sub(/^[ \t]+/, ""); buf = buf " " $0; next }
            { if (held) print buf; buf = $0; held = /[^ \t]/; if (!held) print }
            END { if (held) print buf }
          ' CHANGELOG.md > changelog-notes.md
          if ! grep -q '[^[:space:]]' changelog-notes.md; then
            echo "::error::CHANGELOG.md has no '## $version' section"
            exit 1
          fi
      - name: Refuse an existing tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${{ steps.meta.outputs.tag }}" --repo "${{ github.repository }}" 2>$null
          if ($LASTEXITCODE -eq 0) { throw "${{ steps.meta.outputs.tag }} is already released. Bump <Version> in Directory.Build.props." }
          $global:LASTEXITCODE = 0
      - name: Test
        run: dotnet test SurvivorsToolkit.sln -c Release
      - name: Publish
        run: |
          $app = "src/SurvivorsToolkit/SurvivorsToolkit.csproj"
          # Self-contained single exe: runs without .NET installed.
          dotnet publish $app -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:PublishReadyToRun=true -o out/standalone
          # Framework-dependent folder: small, for machines with the .NET 8 Desktop Runtime
          # or where antivirus refuses large unsigned single-file exes.
          dotnet publish $app -c Release -r win-x64 --no-self-contained -p:PublishReadyToRun=true -o out/portable
          # Self-contained folder for the Setup.exe (Velopack, see AppUpdates.cs). A folder rather than one file: Velopack's
          # Update.exe swaps whole folders, and updates between versions only download the files that changed.
          dotnet publish $app -c Release -r win-x64 --self-contained -p:PublishReadyToRun=true -o out/velopack
      # Builds the Setup.exe and the update packages that installed copies download. The previous release's packages are
      # fetched first so this one can include a delta (only what changed).
      - name: Setup.exe and update packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          dotnet tool install -g vpk --version 1.2.161
          vpk download github --repoUrl "https://github.com/${{ github.repository }}" --token $env:GH_TOKEN -o out/vpk
          if ($LASTEXITCODE -ne 0) { Write-Output "No earlier Velopack release to make a delta from."; $global:LASTEXITCODE = 0 }
          # The exe's own icon (<ApplicationIcon> in the csproj), when it has one, also goes on the Setup.exe.
          $icon = ([xml](Get-Content src/SurvivorsToolkit/SurvivorsToolkit.csproj)).Project.PropertyGroup.ApplicationIcon | Where-Object { $_ } | Select-Object -First 1
          $iconArgs = if ($icon) { @('--icon', (Join-Path src/SurvivorsToolkit $icon)) } else { @() }
          vpk pack --packId AzraelGodKing.SurvivorsToolkit --packVersion "${{ steps.meta.outputs.version }}" --packDir out/velopack `
            --mainExe SurvivorsToolkit.exe --packTitle "Survivor's Toolkit" --packAuthors Azrael --noPortable -o out/vpk @iconArgs
          if ($LASTEXITCODE -ne 0) { throw "vpk pack failed" }
          Get-ChildItem out/vpk
      - name: Package
        run: |
          $v = "${{ steps.meta.outputs.version }}"
          New-Item -ItemType Directory -Force release | Out-Null
          # Velopack finds its packages by these exact names, so only the Setup.exe is renamed.
          Copy-Item out/vpk/AzraelGodKing.SurvivorsToolkit-win-Setup.exe "release/SurvivorsToolkit-$v-Setup.exe"
          Copy-Item "out/vpk/AzraelGodKing.SurvivorsToolkit-$v-*.nupkg", out/vpk/releases.win.json, out/vpk/assets.win.json, out/vpk/RELEASES release/
          Copy-Item out/standalone/SurvivorsToolkit.exe "release/SurvivorsToolkit-$v-win-x64.exe"
          Compress-Archive -Path out/portable/* -DestinationPath "release/SurvivorsToolkit-$v-win-x64-framework-dependent.zip"
          $sums = Get-ChildItem release -File | ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant())  $($_.Name)" }
          Set-Content -Path release/SHA256SUMS.txt -Value ($sums -join "`n") -NoNewline -Encoding ascii
          Get-ChildItem release
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ inputs.notes }}
        run: |
          $notes = Get-Content changelog-notes.md -Raw
          if ($env:NOTES) { $notes = $env:NOTES + "`n`n" + $notes }
          Set-Content -Path release-notes.md -Value $notes -Encoding utf8
          # A version like 1.2.0-beta.1 is a pre-release, which the app's update check skips.
          $pre = if ('${{ steps.meta.outputs.version }}'.Contains('-')) { @('--prerelease') } else { @() }
          gh release create "${{ steps.meta.outputs.tag }}" (Get-ChildItem release/*).FullName `
            --repo "${{ github.repository }}" --target "${{ github.sha }}" `
            --title "Survivor's Toolkit ${{ steps.meta.outputs.version }}" --notes-file release-notes.md @pre
